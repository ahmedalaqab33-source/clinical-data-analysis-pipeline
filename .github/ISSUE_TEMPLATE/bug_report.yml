name: Bug report
description: Report a reproducible defect in the clinical data analysis workflow
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve this research software. Do not include patient-level data, credentials, unpublished restricted material, or other sensitive information.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the minimal commands or steps needed to reproduce the problem using non-sensitive example data.
      placeholder: |
        1. Install dependencies...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Python version, operating system, and relevant package versions.
      placeholder: "Python 3.11, Ubuntu 24.04, pandas 2.x"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirm that this report contains no patient-level, confidential, restricted, or credential data.
          required: true
